<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Alo Relief Trust">
  <!--
    The horizon follows the reader's system theme, so the mark stays legible in a
    dark browser chrome rather than dissolving into it. A tab strip is the one
    surface the application's own theme toggle cannot reach.
  -->
  <style>
    .horizon { fill: #2A2622; }
    @media (prefers-color-scheme: dark) {
      .horizon { fill: #F7F5F1; }
    }
  </style>

  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4B15E" />
      <stop offset="1" stop-color="#E08A2E" />
    </linearGradient>
  </defs>

  <g stroke="#E9A147" stroke-width="4.5" stroke-linecap="round">
    <line x1="32" y1="14" x2="32" y2="7" />
    <line x1="17.6" y1="19.6" x2="12.6" y2="14.6" />
    <line x1="46.4" y1="19.6" x2="51.4" y2="14.6" />
    <line x1="11.5" y1="33" x2="4.5" y2="33" />
    <line x1="52.5" y1="33" x2="59.5" y2="33" />
  </g>

  <path d="M 15 44 A 17 17 0 0 1 49 44 Z" fill="url(#sun)" />
  <rect class="horizon" x="6" y="48" width="52" height="5" rx="2.5" />
</svg>
